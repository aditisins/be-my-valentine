<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A playful little Valentine question made with love.">
  <meta name="theme-color" content="#f8cbd3">
  <meta property="og:type" content="website">
  <meta property="og:title" content="A very important Valentine question">
  <meta property="og:description" content="Someone has a tiny but very important question for you.">
  <title>A Very Important Valentine Question</title>
  <link rel="icon" href="./images/baddie.jpg">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="background-hearts" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <main class="site-shell">
    <article class="valentine-card" aria-labelledby="valentineQuestion">
      <p class="postmark" aria-hidden="true"><strong>14</strong><span>FEB</span></p>

      <section id="questionView">
        <div class="art-frame">
          <span class="tape tape-left" aria-hidden="true"></span>
          <span class="tape tape-right" aria-hidden="true"></span>
          <img id="imageDisplay" src="./images/image1.gif" alt="A happy duck surrounded by hearts" width="512" height="512">
        </div>

        <div class="question-copy">
          <h1 id="valentineQuestion">Will you be my Valentine?</h1>
          <p class="status-message" id="statusMessage" role="status" aria-live="polite"></p>
        </div>

        <div class="response-stage" id="responseStage">
          <button class="button button-yes" id="yesButton" type="button">Yes</button>
          <button class="button button-no" id="noButton" type="button">No</button>
        </div>

      </section>

      <section class="result-view" id="resultView" aria-live="polite" hidden>
        <div class="result-art">
          <img class="result-image" id="resultImage" src="./images/image7.gif" alt="Two ducks celebrating together" width="500" height="500">
          <img class="result-sticker" id="resultSticker" src="./images/baddie.jpg" alt="A glamorous duck" width="200" height="220">
        </div>
        <h1 id="resultTitle" tabindex="-1">It's a date.</h1>
        <div class="result-actions">
          <button class="button button-yes" id="shareButton" type="button">Share</button>
          <button class="button button-secondary" id="replayButton" type="button">Replay</button>
        </div>
        <p class="share-status" id="shareStatus" role="status" aria-live="polite"></p>
      </section>
    </article>

  </main>

  <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>
  <script src="./config.js" defer></script>
  <script src="./script.js" defer></script>
</body>
</html>
